name: Feature request
description: A new protocol, transport or command.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. For a new link format, add a redacted example and a link to its spec.
    validations:
      required: true
